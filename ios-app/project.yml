name: BitcoinAutoTrader
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BitcoinAutoTrader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BitcoinAutoTrader
        excludes:
          - "Resources/Info.plist"
    resources:
      - BitcoinAutoTrader/Resources/Assets.xcassets
    info:
      path: BitcoinAutoTrader/Resources/Info.plist
      properties:
        CFBundleDisplayName: Bitcoin Auto Trader
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BitcoinAutoTrader
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
